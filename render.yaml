# Render Blueprint Specification for UniCast Web Radio Platform
# Official documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: unicast
    runtime: node
    plan: starter # or free
    region: frankfurt # Low latency to East Africa / Uganda
    buildCommand: npm install && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/stream/status
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: TZ
        value: Africa/Kampala
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_RADIO_STREAM_URL
        value: https://stream.zeno.fm/f3wvbbqmdg8uv
      - key: NEXT_PUBLIC_STREAM_URL
        value: https://stream.zeno.fm/f3wvbbqmdg8uv
      - key: NEXT_PUBLIC_FALLBACK_STREAM_URL
        value: https://stream.zeno.fm/f3wvbbqmdg8uv
      - key: NEXT_PUBLIC_STATION_NAME
        value: UniCast
      - key: NEXT_PUBLIC_STATION_FREQUENCY
        value: Online Radio Network
      - key: NEXT_PUBLIC_STATION_TAGLINE
        value: Your Campus Pulse
      - key: DATABASE_URL
        fromDatabase:
          name: unicast-db
          property: connectionString

databases:
  - name: unicast-db
    databaseName: unicast
    user: unicast_admin
    plan: starter # or free
    region: frankfurt
